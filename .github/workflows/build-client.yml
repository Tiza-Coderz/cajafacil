name: Build cliente

# Build de producción para un negocio real: sin modo demo, con la
# sincronización de SU proyecto de Supabase y firmado con la clave de release.
# Se lanza a mano: Actions > Build cliente > Run workflow.
#
# Cada cliente es un *Environment* de GitHub (Settings > Environments) con
# sus propios secrets. Guía completa: docs/despliegue-cliente.md
#   SUPABASE_URL, SUPABASE_ANON_KEY   (obligatorios si sync = true)
#   SUPPORT_WHATSAPP                  (opcional, formato 53XXXXXXXX)
#   OWNER_EMAIL, OWNER_PASSWORD       (solo para sembrar datos de prueba)
# Firma (secrets del repositorio): ANDROID_KEYSTORE_BASE64,
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  workflow_dispatch:
    inputs:
      cliente:
        description: "Environment de GitHub del cliente (p. ej. cliente-demo)"
        required: true
        default: cliente-demo
      sync:
        description: "Activar sincronización con Supabase"
        type: boolean
        default: true
      sembrar:
        description: "Cargar datos de prueba en Supabase antes de compilar"
        type: boolean
        default: false
      web:
        description: "Compilar también la versión web"
        type: boolean
        default: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.32.7"

jobs:
  config:
    name: Validar configuración
    runs-on: ubuntu-latest
    environment: ${{ inputs.cliente }}
    steps:
      - name: Revisar secrets
        env:
          SYNC: ${{ inputs.sync }}
          SEED: ${{ inputs.sembrar }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          ok=true
          if [ "$SYNC" = "true" ] || [ "$SEED" = "true" ]; then
            [ -n "$SUPABASE_URL" ] || { echo "::error::Falta el secret SUPABASE_URL en '${{ inputs.cliente }}'"; ok=false; }
            [ -n "$SUPABASE_ANON_KEY" ] || { echo "::error::Falta el secret SUPABASE_ANON_KEY en '${{ inputs.cliente }}'"; ok=false; }
          fi
          if [ "$SEED" = "true" ]; then
            [ -n "$OWNER_EMAIL" ] || { echo "::error::Falta el secret OWNER_EMAIL (para sembrar)"; ok=false; }
            [ -n "$OWNER_PASSWORD" ] || { echo "::error::Falta el secret OWNER_PASSWORD (para sembrar)"; ok=false; }
          fi
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::Sin keystore de release: el APK se firma con la clave de depuración. No lo entregue a un cliente real (no podrá actualizarlo después)."
          fi
          $ok

  seed:
    name: Sembrar datos de prueba
    needs: config
    if: ${{ inputs.sembrar }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.cliente }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: SQLite para la BD en memoria
        run: sudo apt-get update -q && sudo apt-get install -y -q libsqlite3-dev
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # Se niega si la cuenta ya tiene datos (evita duplicados).
      - name: Cargar el negocio de ejemplo en Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        run: dart run tool/seed_supabase.dart

  apk:
    name: APK de cliente
    needs: [config, seed]
    # Corre aunque no se haya pedido sembrar (seed = skipped).
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.cliente }}
    timeout-minutes: 40
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      # La configuración se arma en el runner y nunca se versiona.
      - name: Generar .env del cliente
        env:
          SYNC: ${{ inputs.sync }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPPORT_WHATSAPP: ${{ secrets.SUPPORT_WHATSAPP }}
        run: |
          {
            echo "DEMO_MODE=false"
            echo "SYNC_ENABLED=$SYNC"
            if [ "$SYNC" = "true" ]; then
              echo "SUPABASE_URL=${SUPABASE_URL%/}"
              echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            fi
            [ -z "$SUPPORT_WHATSAPP" ] || echo "SUPPORT_WHATSAPP=$SUPPORT_WHATSAPP"
          } > "$RUNNER_TEMP/client.env"
          sed -E 's/(KEY=).+/\1***/' "$RUNNER_TEMP/client.env"

      - name: Preparar keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compilar APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CLIENTE: ${{ inputs.cliente }}
        run: |
          defines="--dart-define-from-file=$RUNNER_TEMP/client.env"
          flutter build apk --release --split-per-abi $defines
          flutter build apk --release $defines
          cd build/app/outputs/flutter-apk
          version=$(grep -m1 '^version:' "$GITHUB_WORKSPACE/pubspec.yaml" | awk '{print $2}' | cut -d+ -f1)
          base="cajafacil-${CLIENTE}-v${version}"
          mv app-arm64-v8a-release.apk   "${base}-arm64.apk"
          mv app-armeabi-v7a-release.apk "${base}-armv7.apk"
          mv app-x86_64-release.apk      "${base}-x86_64.apk"
          mv app-release.apk             "${base}-universal.apk"
          ls -lh *.apk

      # Artefacto privado del workflow (no release pública): lleva la
      # configuración del cliente.
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.cliente }}
          path: build/app/outputs/flutter-apk/cajafacil-*.apk
          retention-days: 30

  web:
    name: Web de cliente
    needs: [config, seed]
    if: ${{ inputs.web && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.cliente }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Compilar web
        env:
          SYNC: ${{ inputs.sync }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPPORT_WHATSAPP: ${{ secrets.SUPPORT_WHATSAPP }}
        run: |
          {
            echo "DEMO_MODE=false"
            echo "SYNC_ENABLED=$SYNC"
            if [ "$SYNC" = "true" ]; then
              echo "SUPABASE_URL=${SUPABASE_URL%/}"
              echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            fi
            [ -z "$SUPPORT_WHATSAPP" ] || echo "SUPPORT_WHATSAPP=$SUPPORT_WHATSAPP"
          } > "$RUNNER_TEMP/client.env"
          # Para la raíz de un dominio (Cloudflare Pages, Netlify…).
          flutter build web --release --no-web-resources-cdn --base-href / \
            --dart-define-from-file="$RUNNER_TEMP/client.env"
      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ inputs.cliente }}
          path: build/web
          retention-days: 30
