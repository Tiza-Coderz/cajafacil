<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Reemplazado por `flutter build web --base-href` (ej. /cajafacil/ en GitHub Pages). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="CajaFácil: punto de venta, inventario y caja para mipymes cubanas. Funciona sin conexión, en USD y CUP.">
  <meta name="theme-color" content="#0f4c75">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CajaFácil">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>CajaFácil · Punto de venta</title>

  <!--
    Pantalla de carga en HTML/CSS puro: aparece al instante, incluso con
    conexión lenta, mientras se descarga el motor de Flutter. Se retira
    con el evento `flutter-first-frame`.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #f7f9fc; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #0f4c75; transition: opacity .25s ease;
    }
    #splash .logo {
      width: 72px; height: 72px; border-radius: 20px; background: #0f4c75;
      display: grid; place-items: center; color: #fff; font-size: 34px;
      font-weight: 700; box-shadow: 0 6px 18px rgba(15, 76, 117, .25);
    }
    #splash h1 { margin: 0; font-size: 26px; }
    #splash p { margin: 0; color: #4a5a6a; font-size: 15px; }
    #splash .bar {
      width: 160px; height: 4px; border-radius: 2px; overflow: hidden;
      background: rgba(15, 76, 117, .15);
    }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: #0f4c75; animation: load 1.1s ease-in-out infinite;
    }
    @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <div class="logo" aria-hidden="true">C$</div>
    <h1>CajaFácil</h1>
    <p>Cargando su punto de venta…</p>
    <div class="bar" aria-hidden="true"></div>
  </div>
  <noscript>
    <p style="text-align:center;font-family:sans-serif">
      Para usar CajaFácil active JavaScript en su navegador.
    </p>
  </noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
